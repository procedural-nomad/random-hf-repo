<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Random Hugging Face Repo</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#111318;color:#f3f4f6;font-family:system-ui,-apple-system,sans-serif;padding:24px}
main{width:min(560px,100%);text-align:center}
h1{margin:0 0 8px;font-size:clamp(30px,8vw,48px);line-height:1.02}
.sub{color:#aeb4c0;min-height:1.5em;margin-bottom:28px}
button{width:100%;border:0;border-radius:18px;padding:22px 18px;font-size:24px;font-weight:800;cursor:pointer;background:#ffd21e;color:#171717;box-shadow:0 8px 28px rgba(0,0,0,.28);touch-action:manipulation}
button:disabled{opacity:.5;cursor:wait}
.meta{margin-top:24px;color:#818896;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>🎲 Random HF Repo</h1>
<div class="sub" id="status">Loading frozen snapshot…</div>
<button id="random" disabled>RANDOM REPO</button>
<div class="meta" id="meta"></div>
</main>
<script>
"use strict";
let manifest=null;
const $=id=>document.getElementById(id), button=$("random");
const fmt=n=>new Intl.NumberFormat().format(n);

function uniformInt(maxExclusive){
  if(!Number.isSafeInteger(maxExclusive)||maxExclusive<=0) throw new Error("Invalid population size");
  const TWO32=0x100000000;
  if(maxExclusive<=TWO32){
    const limit=Math.floor(TWO32/maxExclusive)*maxExclusive,buf=new Uint32Array(1);
    do{crypto.getRandomValues(buf)}while(buf[0]>=limit);
    return buf[0]%maxExclusive;
  }
  const MAX53=0x20000000000000,limit=Math.floor(MAX53/maxExclusive)*maxExclusive,buf=new Uint32Array(2);
  let x;
  do{crypto.getRandomValues(buf);x=(buf[0]&0x001fffff)*TWO32+buf[1]}while(x>=limit);
  return x%maxExclusive;
}

async function ungzipToText(response){
  if(!response.ok) throw new Error(`HTTP ${response.status}`);
  if(!("DecompressionStream" in window)) throw new Error("Browser lacks gzip support");
  return await new Response(response.body.pipeThrough(new DecompressionStream("gzip"))).text();
}

function repoUrl(prefix,id){
  if(prefix==="m") return `https://huggingface.co/${id}`;
  if(prefix==="d") return `https://huggingface.co/datasets/${id}`;
  if(prefix==="s") return `https://huggingface.co/spaces/${id}`;
  throw new Error("Unknown repo type");
}

async function pick(){
  button.disabled=true;$("status").textContent="Rolling…";
  try{
    const globalIndex=uniformInt(manifest.total_repos);
    const chunkIndex=Math.floor(globalIndex/manifest.chunk_size);
    const lineIndex=globalIndex%manifest.chunk_size;
    const chunk=manifest.chunks[chunkIndex];
    const text=await ungzipToText(await fetch(chunk.file,{cache:"force-cache"}));
    const line=text.trimEnd().split("\n")[lineIndex];
    const tab=line.indexOf("\t"),prefix=line.slice(0,tab),id=line.slice(tab+1);
    location.href=repoUrl(prefix,id);
  }catch(err){
    console.error(err);$("status").textContent=`Error: ${err.message}`;button.disabled=false;
  }
}

async function init(){
  try{
    const r=await fetch("manifest.json",{cache:"no-cache"});
    if(!r.ok) throw new Error("No snapshot deployed yet");
    manifest=await r.json();
    $("status").textContent=`${fmt(manifest.total_repos)} public repos in frozen snapshot`;
    $("meta").textContent=`${fmt(manifest.counts.model)} models · ${fmt(manifest.counts.dataset)} datasets · ${fmt(manifest.counts.space)} spaces · snapshot ${new Date(manifest.generated_at_utc).toLocaleString()}`;
    button.disabled=false;
  }catch(err){
    $("status").textContent="No snapshot deployed yet.";
    $("meta").textContent="Run the GitHub Actions rebuild workflow once.";
  }
}
button.addEventListener("click",pick);init();
</script>
</body>
</html>
